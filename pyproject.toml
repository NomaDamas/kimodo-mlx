[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimodo-mlx"
version = "0.1.0"
description = "Apple Silicon MLX/Metal port of NVIDIA Kimodo"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "mlx>=0.32",
  "numpy>=1.26",
  "gguf>=0.17",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "torch>=2.4"]

[project.scripts]
kimodo-mlx = "kimodo_mlx.cli:main"

[tool.setuptools.packages.find]
include = ["kimodo_mlx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
