  }
  ctx.fillStyle = "#f3ece0";
  for (const p of posed) {
    const xy = map(p);
    ctx.beginPath(); ctx.arc(xy[0], xy[1], 2.4, 0, Math.PI*2); ctx.fill();
  }
}
function render(frame) {
  for (const key of Object.keys(canvases)) draw(canvases[key], DATA.clips[key], frame);
  document.getElementById("frame").textContent = String(frame).padStart(2,"0") + " / " + (DATA.timings.frames||30);
}
let frame = 0, playing = false, timer = null;
document.getElementById("play").onclick = () => {
  playing = !playing;
  document.getElementById("play").textContent = playing ? "정지" : "재생";
  if (playing) {
    timer = setInterval(() => {
      frame = (frame + 1) % (DATA.timings.frames || 30);
      document.getElementById("scrub").value = frame;
      render(frame);
    }, 1000/30);
  } else { clearInterval(timer); }
};
document.getElementById("scrub").oninput = (e) => { frame = Number(e.target.value); render(frame); };
const tb = document.getElementById("times");
function pretty(v) {
  if (v == null) return "—";
  return v >= 1 ? v.toFixed(2)+"s" : (v*1000).toFixed(0)+"ms";
}
tb.innerHTML = "<tr><th>런타임</th><th>가중치 상주</th><th>인코드</th><th>샘플</th><th>E2E</th><th>실행</th></tr>" +
  DATA.timings.backends.map(b => {
    return "<tr><td>"+b.label+"</td><td>"+(b.weight_resident ? "예" : "아니오")+"</td><td class=\"mono\">"+pretty(b.encode_s)+"</td><td class=\"mono\">"+pretty(b.sample_s)+"</td><td class=\"mono\">"+pretty(b.e2e_s)+"</td><td class=\""+(b.runnable?"ok":"no")+"\">"+(b.runnable?"실측":"미실행")+"</td></tr>";
  }).join("");
const mlx = DATA.timings.backends.find(b => b.id==="mlx-warm");
const cpp = DATA.timings.backends.find(b => b.id==="cpp-metal");
let verdict = "실측이 아직 부족합니다.";
if (mlx && cpp && mlx.runnable && cpp.runnable) {
  const ratio = cpp.e2e_s / mlx.e2e_s;
  const worked = mlx.e2e_s < cpp.e2e_s;
  verdict = worked
    ? ("효과가 있었습니다. 가중치를 올려 둔 kimodo-mlx는 kimodo.cpp Metal 대비 같은 클립을 " + ratio.toFixed(1) + "배 빨리 만들었습니다 (" + mlx.e2e_s.toFixed(2) + "s vs " + cpp.e2e_s.toFixed(2) + "s). 콜드 스타트는 15GB LLM2Vec을 읽는 비용이 비슷합니다. ONNX와 원본 NVIDIA Python은 이 머신에서 생성 실측이 없습니다.")
    : ("가중치 상주 MLX가 cpp Metal보다 빠르지 않았습니다 (" + mlx.e2e_s.toFixed(2) + "s vs " + cpp.e2e_s.toFixed(2) + "s).");
}
document.getElementById("verdict").textContent = verdict;
const q = DATA.timings.quality || {};
document.getElementById("quality").textContent = q.posed_mae_mlx_vs_cpp_metal != null
  ? ("MLX vs cpp Metal 관절 위치 MAE " + q.posed_mae_mlx_vs_cpp_metal.toFixed(4) + " m, max " + q.posed_max_mlx_vs_cpp_metal.toFixed(4) + " m. 시드는 같으나 초기 노이즈 RNG는 다릅니다.")
  : "";
document.getElementById("backend-notes").innerHTML = DATA.timings.backends.map(b => "<li><strong>"+b.label+":</strong> "+(b.notes||"")+"</li>").join("");
render(0);
</script>
